<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kurbağam">
<title>Kurbağam 🐸</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9ee0ff;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 12px);right:calc(env(safe-area-inset-right) + 12px);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;pointer-events:none;z-index:5}
#nameTag{background:#fff;border-radius:999px;padding:8px 20px;font-weight:800;font-size:26px;color:#2f7d1f;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#bars{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:8px 16px;background:rgba(255,255,255,.88);padding:10px 16px;border-radius:20px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.bar{display:flex;align-items:center;gap:8px;font-size:24px}
.trk{flex:1;height:18px;background:#e3e3e3;border-radius:10px;overflow:hidden;min-width:90px}
.fill{height:100%;width:50%;background:#58c742;border-radius:10px;transition:width .5s,background .5s}
.fill.mid{background:#ffc53d}.fill.low{background:#ff6b5b}
#actions{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:center;gap:12px;padding:0 10px;flex-wrap:wrap;z-index:5}
#actions button{border:0;background:#fff;border-radius:22px;width:108px;height:100px;font-size:20px;font-weight:800;color:#335;box-shadow:0 6px 0 #c9d6e3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;cursor:pointer}
#actions button b{font-size:40px;line-height:1.1}
#actions button:active{transform:translateY(4px);box-shadow:0 2px 0 #c9d6e3}
#bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:#fff;border-radius:22px;padding:12px 20px;font-size:26px;font-weight:800;color:#234;max-width:min(80vw,440px);width:max-content;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12);opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
#bubble::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
#bubble.show{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.fx{position:absolute;left:0;top:0;font-size:42px;line-height:1;margin:-21px 0 0 -21px;will-change:transform}
.pop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 135px);transform:translateX(-50%);background:#fff;border-radius:26px;padding:14px;display:flex;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:8;flex-wrap:wrap;justify-content:center;max-width:94vw}
.pop button{border:0;background:#f0f7ff;border-radius:18px;width:96px;height:100px;font-size:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;cursor:pointer}
.pop button small{font-size:16px;font-weight:800;color:#335;margin-top:4px}
.pop button.sel{background:#c8f0b5;outline:4px solid #58c742}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(10,30,60,.45);display:flex;align-items:center;justify-content:center;z-index:30}
.card{background:#fff;border-radius:32px;padding:28px;width:min(90vw,480px);text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.card .big{font-size:90px;line-height:1.1}
.card h2{margin:8px 0 18px;font-size:30px;color:#234}
.card input{width:100%;font-size:32px;padding:12px 16px;border-radius:18px;border:4px solid #9bd98a;text-align:center;font-family:inherit;font-weight:800;user-select:text;-webkit-user-select:text;outline:none;color:#2f7d1f}
.btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:20px;padding:16px 28px;font-size:26px;font-weight:800;font-family:inherit;background:#58c742;color:#fff;box-shadow:0 5px 0 #3d9a2b;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3d9a2b}
.btn.alt{background:#ff9f43;box-shadow:0 5px 0 #d97f22}
#game{position:fixed;inset:0;background:linear-gradient(#bfeaff 0%,#bfeaff 55%,#8fd17a 100%);z-index:15;overflow:hidden}
#gHud{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:10px 26px;font-size:32px;font-weight:800;color:#234;display:flex;gap:26px;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.1)}
#gTitle{position:absolute;top:calc(env(safe-area-inset-top) + 90px);left:0;right:0;text-align:center;font-size:30px;font-weight:800;color:#2f7d1f}
#gFrog{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);font-size:130px;line-height:1}
#tongue{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fly{position:absolute;left:0;top:0;font-size:56px;line-height:1;width:84px;height:84px;margin:-42px 0 0 -42px;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="nameTag">🐸 <span id="nm">Kurbağam</span></div>
  <div id="bars">
    <div class="bar"><span>🍔</span><div class="trk"><div class="fill" id="b_hunger"></div></div></div>
    <div class="bar"><span>😊</span><div class="trk"><div class="fill" id="b_happy"></div></div></div>
    <div class="bar"><span>⚡</span><div class="trk"><div class="fill" id="b_energy"></div></div></div>
    <div class="bar"><span>🛁</span><div class="trk"><div class="fill" id="b_clean"></div></div></div>
  </div>
</div>
<div id="bubble"></div>
<div id="actions">
  <button data-a="feed"><b>🍪</b>Besle</button>
  <button data-a="bath"><b>🛁</b>Banyo</button>
  <button data-a="sleep" id="sleepBtn"><b>💤</b>Uyut</button>
  <button data-a="play"><b>🎮</b>Oyna</button>
  <button data-a="dress"><b>🎩</b>Giydir</button>
</div>
<div id="feedMenu" class="pop hidden">
  <button data-food="sinek">🪰<small>Sinek</small></button>
  <button data-food="kurabiye">🍪<small>Kurabiye</small></button>
  <button data-food="cilek">🍓<small>Çilek</small></button>
  <button data-food="pizza">🍕<small>Pizza</small></button>
</div>
<div id="dressMenu" class="pop hidden">
  <button data-hat="none">🐸<small>Hiçbiri</small></button>
  <button data-hat="sapka">🎩<small>Şapka</small></button>
  <button data-hat="tac">👑<small>Taç</small></button>
  <button data-hat="gozluk">🕶️<small>Gözlük</small></button>
  <button data-hat="fiyonk">🎀<small>Fiyonk</small></button>
  <button data-hat="parti">🥳<small>Parti</small></button>
</div>
<div id="fx"></div>
<div id="game" class="hidden">
  <svg id="tongue"></svg>
  <div id="gHud"><span>🪰 <span id="gScore">0</span></span><span>⏱️ <span id="gTime">30</span></span></div>
  <div id="gTitle">Sineklere dokun, kurbağa yakalasın!</div>
  <div id="gFrog">🐸</div>
</div>
<div id="modal" class="modal hidden"><div class="card" id="mCard"></div></div>

<script>/*THREE_JS*/</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY='kurbagam_v1';

// ---------------- STATE ----------------
const st={name:'',hunger:85,happy:85,energy:85,clean:90,poops:[],hat:'none',sleeping:false,last:Date.now(),hwDay:'',best:0,nextPoopAt:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)Object.assign(st,s);}catch(e){}
(function offline(){
  const el=Math.min((Date.now()-(st.last||Date.now()))/1000,3*3600);
  if(el<5)return;
  if(st.sleeping){st.energy=Math.min(100,st.energy+el*0.08);st.hunger=Math.max(15,st.hunger-el*0.004);}
  else{st.hunger=Math.max(15,st.hunger-el*0.01);st.happy=Math.max(15,st.happy-el*0.007);st.energy=Math.max(15,st.energy-el*0.006);st.clean=Math.max(15,st.clean-el*0.003);}
  if(st.nextPoopAt&&st.nextPoopAt<Date.now())st.nextPoopAt=Date.now()+6000;
})();
let poops=[];
function save(){st.last=Date.now();st.poops=poops.map(p=>({x:p.x,z:p.z}));try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

// ---------------- AUDIO ----------------
let ac=null;
function A(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){ac=null;}return ac;}
function tone(f1,f2,dur,type,vol,delay){const a=A();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol,ftype,freq,delay){const a=A();if(!a)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=ftype;f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+(delay||0));}
const snd={
  ribbit(){tone(320,170,.12,'square',.09);tone(340,190,.15,'square',.09,.17);},
  giggle(){for(let i=0;i<4;i++)tone(700+i*60,900+i*60,.08,'triangle',.15,i*.09);},
  chomp(){tone(220,90,.08,'square',.15);tone(240,100,.08,'square',.15,.15);tone(230,95,.08,'square',.15,.3);},
  plop(){tone(700,110,.18,'sine',.35);},
  ding(){tone(880,1320,.2,'triangle',.2);tone(1320,1760,.25,'triangle',.18,.15);},
  splash(){noise(.5,.4,'highpass',1500);noise(.4,.3,'highpass',2500,.35);},
  sad(){tone(400,250,.35,'sine',.15);},
  fart(long){const a=A();if(!a)return;const t=a.currentTime,d=long?1.0:.65;const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(105,t);o.frequency.linearRampToValueAtTime(65,t+d);const l=a.createOscillator();l.frequency.value=24;const lg=a.createGain();lg.gain.value=32;l.connect(lg);lg.connect(o.frequency);const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=420;const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.03);g.gain.setValueAtTime(.55,t+d*.65);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);l.start(t);o.stop(t+d+.02);l.stop(t+d+.02);}
};

// ---------------- THREE SCENE ----------------
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const DAY=new THREE.Color(0x9ee0ff),NIGHT=new THREE.Color(0x1b2550);
scene.background=DAY.clone();
scene.fog=new THREE.Fog(0x9ee0ff,16,34);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
const hemi=new THREE.HemisphereLight(0xffffff,0x6a8f4a,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(4,9,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7});scene.add(sun);
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o||{}));}
const SPH=new THREE.SphereGeometry(1,32,24);
function mesh(g,m,x,y,z,sx,sy,sz){const k=new THREE.Mesh(g,m);k.position.set(x||0,y||0,z||0);k.scale.set(sx||1,sy===undefined?(sx||1):sy,sz===undefined?(sx||1):sz);k.castShadow=true;k.receiveShadow=true;return k;}

// ground & decor
const ground=mesh(new THREE.CylinderGeometry(7,7.4,.6,64),M(0x7cd35a,{roughness:.9}),0,-.3,0);ground.castShadow=false;scene.add(ground);
const water=mesh(new THREE.CylinderGeometry(2.1,2.1,.06,48),M(0x4fb6e8,{roughness:.15,metalness:.1}),-3.1,.02,-2.4,1,1,.7);water.castShadow=false;scene.add(water);
const padM=M(0x3a9a35);
[[-3.6,-2.5],[-2.4,-2.1],[-3.1,-2.9]].forEach(([x,z],i)=>{const p=mesh(new THREE.CylinderGeometry(.42,.42,.04,24,1,false,.4,5.6),padM,x,.07,z);scene.add(p);if(i===0){scene.add(mesh(SPH,M(0xff8fc8),x,.17,z,.13));scene.add(mesh(SPH,M(0xffe066),x,.24,z,.06));}});
const rockM=M(0xa7a7a7,{roughness:.95});
[[-1.4,-2.5,.35],[-4.8,-1.3,.45],[-1.9,-1.6,.22]].forEach(([x,z,s])=>scene.add(mesh(SPH,rockM,x,s*.4,z,s,s*.7,s)));
function mushroom(x,z,s){const g=new THREE.Group();g.add(mesh(new THREE.CylinderGeometry(.12,.16,.4,12),M(0xfff4e0),0,.2,0));const cap=mesh(new THREE.SphereGeometry(.38,20,12,0,Math.PI*2,0,Math.PI/2),M(0xe8453c),0,.36,0);g.add(cap);[[.15,.6,.1],[-.12,.58,-.1],[0,.7,0],[-.05,.55,.22]].forEach(p=>g.add(mesh(SPH,M(0xffffff),p[0],p[1]-.08,p[2],.06)));g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);}
mushroom(3.3,-2.2,1.2);mushroom(4.1,-1.3,.8);mushroom(-4.6,1.2,.9);
function flower(x,z,c){const g=new THREE.Group();g.add(mesh(new THREE.CylinderGeometry(.025,.025,.5,6),M(0x3d8b30),0,.25,0));for(let i=0;i<5;i++){const a=i/5*Math.PI*2;g.add(mesh(SPH,M(c),Math.cos(a)*.09,.52,Math.sin(a)*.09,.07));}g.add(mesh(SPH,M(0xffd23f),0,.53,0,.06));g.position.set(x,0,z);scene.add(g);}
[[3,1.5,0xff7eb6],[3.6,.6,0xffffff],[-3.2,2.4,0xb48cff],[2.2,3.2,0xff7eb6],[-1.9,3.4,0xffffff],[4.6,2.2,0xb48cff],[1.2,-3,0xffffff],[-5.2,-.2,0xff7eb6]].forEach(f=>flower(f[0],f[1],f[2]));
const hillM=M(0x6cc24f,{roughness:1});
[[-9,-14,6],[0,-17,8],[10,-14,7]].forEach(([x,z,s])=>{const h=mesh(SPH,hillM,x,-1,z,s,s*.55,s);h.castShadow=false;scene.add(h);});
const cloudM=M(0xffffff,{roughness:1});const clouds=new THREE.Group();
[[-6,7,-12],[5,8,-14],[0,9,-18]].forEach(([x,y,z])=>{const c=new THREE.Group();[[0,0,1.2],[1.1,-.2,.9],[-1.1,-.2,.9],[.5,.4,.8]].forEach(p=>{const m=mesh(SPH,cloudM,p[0],p[1],0,p[2]);m.castShadow=false;c.add(m);});c.position.set(x,y,z);clouds.add(c);});scene.add(clouds);

// ---------------- FROG ----------------
const frog=new THREE.Group();scene.add(frog);
const body=new THREE.Group();frog.add(body);
const greenM=M(0x5ccf4a,{roughness:.5}),bellyM=M(0xd9f7a6,{roughness:.7}),whiteM=M(0xffffff,{roughness:.3}),blackM=M(0x111111,{roughness:.2});
body.add(mesh(SPH,greenM,0,.9,0,1.15,.85,1));
body.add(mesh(SPH,bellyM,0,.72,.5,.8,.6,.55));
const eyes=[];
[-1,1].forEach(s=>{
  body.add(mesh(SPH,greenM,s*.5,1.65,.35,.36));
  const inner=new THREE.Group();inner.position.set(s*.5,1.69,.47);
  inner.add(mesh(SPH,whiteM,0,0,0,.29));
  const pupil=new THREE.Group();pupil.add(mesh(SPH,blackM,0,0,.23,.14));pupil.add(mesh(SPH,whiteM,.05,.06,.35,.045));
  inner.add(pupil);body.add(inner);eyes.push({inner,pupil});
});
const mouth=mesh(new THREE.TorusGeometry(.3,.045,8,28,Math.PI),M(0x2b5e22),0,1.12,.97,1,.6,1);mouth.rotation.set(-.25,0,Math.PI);body.add(mouth);
const mouthOpen=mesh(SPH,M(0x8b1e2e),0,1.0,.93,.28,.01,.1);body.add(mouthOpen);
const cheekM=M(0xff9db0,{transparent:true,opacity:.75});
[-1,1].forEach(s=>body.add(mesh(SPH,cheekM,s*.72,1.05,.72,.18,.11,.06)));
[-1,1].forEach(s=>{body.add(mesh(SPH,greenM,s*.88,.28,.1,.42,.3,.6));body.add(mesh(SPH,greenM,s*.52,.08,.78,.33,.14,.42));});
frog.position.set(0,0,.4);

// hats / accessories
const hats={};
(function(){
  const sp=new THREE.Group();sp.add(mesh(new THREE.CylinderGeometry(.55,.55,.05,28),blackM,0,0,0));sp.add(mesh(new THREE.CylinderGeometry(.32,.34,.6,28),blackM,0,.32,0));sp.add(mesh(new THREE.CylinderGeometry(.345,.345,.12,28),M(0xe8453c),0,.1,0));hats.sapka=sp;
  const goldM=M(0xffcc33,{metalness:.6,roughness:.3,side:THREE.DoubleSide});const tc=new THREE.Group();tc.add(mesh(new THREE.CylinderGeometry(.36,.36,.3,24,1,true),goldM,0,.15,0));for(let i=0;i<6;i++){const a=i/6*Math.PI*2;tc.add(mesh(new THREE.ConeGeometry(.08,.2,8),goldM,Math.cos(a)*.36,.38,Math.sin(a)*.36));tc.add(mesh(SPH,M([0xe8453c,0x3a7bff,0x3ad46b][i%3]),Math.cos(a)*.36,.15,Math.sin(a)*.36,.06));}hats.tac=tc;
  const gz=new THREE.Group();const lensM=new THREE.MeshStandardMaterial({color:0x111122,transparent:true,opacity:.85,roughness:.1,side:THREE.DoubleSide});
  [-1,1].forEach(s=>{gz.add(mesh(new THREE.TorusGeometry(.3,.045,8,24),blackM,s*.5,0,0));gz.add(mesh(new THREE.CircleGeometry(.3,24),lensM,s*.5,0,-.01));});
  gz.add(mesh(new THREE.CylinderGeometry(.03,.03,.4,8),blackM,0,.02,0)).rotation.z=Math.PI/2;gz.position.set(0,-.1,.8);hats.gozluk=gz;
  const pinkM=M(0xff5fa2);const fy=new THREE.Group();[-1,1].forEach(s=>{const c=mesh(new THREE.ConeGeometry(.2,.38,16),pinkM,s*.2,0,0);c.rotation.z=s*Math.PI/2;fy.add(c);});fy.add(mesh(SPH,pinkM,0,0,0,.1));fy.position.set(0,.1,.15);hats.fiyonk=fy;
  const pt=new THREE.Group();pt.add(mesh(new THREE.ConeGeometry(.3,.75,24),M(0x9b6bff),0,.38,0));pt.add(mesh(new THREE.TorusGeometry(.27,.04,6,24),M(0xffd23f),0,.12,0)).rotation.x=Math.PI/2;pt.add(mesh(SPH,M(0xffd23f),0,.78,0,.1));hats.parti=pt;
  const holder=new THREE.Group();holder.position.set(0,1.78,-.05);body.add(holder);
  Object.values(hats).forEach(h=>{h.visible=false;holder.add(h);});
})();
function applyHat(){Object.keys(hats).forEach(k=>hats[k].visible=(k===st.hat));document.querySelectorAll('#dressMenu button').forEach(b=>b.classList.toggle('sel',b.dataset.hat===st.hat));}

// ---------------- POOPS & FLIES ----------------
const poopM=M(0x8a5328,{roughness:.8});
function makePoop(){const g=new THREE.Group();g.add(mesh(SPH,poopM,0,.13,0,.38,.16,.38));g.add(mesh(SPH,poopM,0,.3,0,.28,.14,.28));g.add(mesh(SPH,poopM,0,.44,0,.17,.12,.17));g.add(mesh(new THREE.ConeGeometry(.08,.18,12),poopM,0,.6,0));
  [-1,1].forEach(s=>{g.add(mesh(SPH,whiteM,s*.09,.33,.24,.075,.075,.05));g.add(mesh(SPH,blackM,s*.09,.33,.285,.035));});
  return g;}
const flyGroup=new THREE.Group();scene.add(flyGroup);
const wingM=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.6});
function makeFly(){const f=new THREE.Group();f.add(mesh(SPH,M(0x222222),0,0,0,.07));const w1=mesh(SPH,wingM,-.06,.05,0,.06,.02,.04),w2=mesh(SPH,wingM,.06,.05,0,.06,.02,.04);f.add(w1,w2);f.userData={w1,w2,ph:Math.random()*6};return f;}

let G=null;
function startGame(){
  closePops();
  if(st.sleeping){say('Şşş... uyuyor 😴');return;}
  if(st.energy<12){say('Çok yorgunum, önce uyumam lazım 🥱');return;}
  $('#game').classList.remove('hidden');$('#gScore').textContent='0';$('#gTime').textContent='30';
  G={score:0,end:now()+30000,flies:[]};for(let i=0;i<5;i++)spawnFly();snd.ribbit();
}
function spawnFly(){if(!G)return;const el=document.createElement('div');el.className='fly';el.textContent='🪰';
  const sp=rand(110,200)+G.score*4,a=rand(0,Math.PI*2);
  const f={el,x:rand(70,innerWidth-70),y:rand(160,innerHeight*.62),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,ph:rand(0,6)};
  el.addEventListener('pointerdown',ev=>{ev.stopPropagation();ev.preventDefault();catchFly(f);});$('#game').appendChild(el);G.flies.push(f);}
function catchFly(f){if(!G||!G.flies.includes(f))return;A();
  G.flies=G.flies.filter(q=>q!==f);G.score++;$('#gScore').textContent=G.score;
  const fr=$('#gFrog').getBoundingClientRect();const mx=fr.left+fr.width/2,my=fr.top+fr.height*.55;
  $('#tongue').innerHTML='<line x1="'+mx+'" y1="'+my+'" x2="'+f.x+'" y2="'+f.y+'" stroke="#ff5f8a" stroke-width="16" stroke-linecap="round"/><circle cx="'+f.x+'" cy="'+f.y+'" r="14" fill="#ff5f8a"/>';
  snd.chomp();f.el.remove();setTimeout(()=>{$('#tongue').innerHTML='';},170);
  const gf=$('#gFrog');try{gf.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.2)'},{transform:'translateX(-50%) scale(1)'}],{duration:250});}catch(e){}
  setTimeout(spawnFly,350);}
function updateGame(dt){
  const left=Math.max(0,Math.ceil((G.end-now())/1000));$('#gTime').textContent=left;
  G.flies.forEach(f=>{f.ph+=dt*3;f.vx+=Math.cos(f.ph)*60*dt;f.vy+=Math.sin(f.ph*1.3)*60*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<50){f.x=50;f.vx=Math.abs(f.vx);}if(f.x>innerWidth-50){f.x=innerWidth-50;f.vx=-Math.abs(f.vx);}
    if(f.y<140){f.y=140;f.vy=Math.abs(f.vy);}if(f.y>innerHeight*.66){f.y=innerHeight*.66;f.vy=-Math.abs(f.vy);}
    f.el.style.transform='translate('+f.x+'px,'+f.y+'px) scaleX('+(f.vx>0?-1:1)+')';});
  if(left<=0)endGame();
}
function endGame(){const sc=G.score;G.flies.forEach(f=>f.el.remove());G=null;$('#game').classList.add('hidden');
  const rec=sc>(st.best||0);if(rec)st.best=sc;
  st.happy=clamp(st.happy+Math.min(40,10+sc*2),0,100);st.hunger=clamp(st.hunger+Math.min(25,sc*1.5),0,100);st.energy=clamp(st.energy-10,0,100);updateBars();save();
  snd.ding();if(rec&&sc>0)confetti();
  modal('<div class="big">🐸🪰</div><h2>Süper! '+sc+' sinek yakaladın!</h2>'+(rec&&sc>0?'<div style="font-size:24px;font-weight:800;color:#ff9f43">🏆 Yeni rekor!</div>':'<div style="font-size:22px;color:#567">Rekor: '+(st.best||0)+'</div>'),[{t:'Tamam 👍',fn:()=>{say('Çok eğlendim! Bir daha oynayalım! 😄');hop();hearts(4);}}]);
}

// ---------------- LOOP ----------------
let last=now(),saveT=0,tickT=0,nightK=isNight()||st.sleeping?1:0,zzzT=0,flyT=0;
function loop(){
  requestAnimationFrame(loop);
  const t=now(),dt=Math.min(.1,(t-last)/1000);last=t;
  if(G){updateGame(dt);return;}
  // stats
  if(st.name&&!modalOpen()){
    if(st.sleeping){st.energy=Math.min(100,st.energy+.08*dt);st.hunger=Math.max(0,st.hunger-.004*dt);st.clean=Math.max(0,st.clean-.002*dt);
      if(st.energy>=100&&!isNight()){st.sleeping=false;updateSleepBtn();snd.ding();say('Uykumu aldım! Günaydın! ☀️');hop();}}
    else{st.hunger=Math.max(0,st.hunger-.01*dt);st.happy=Math.max(0,st.happy-.007*dt);st.energy=Math.max(0,st.energy-.006*dt);st.clean=Math.max(0,st.clean-(.003+.012*poops.length)*dt);}
    if(st.nextPoopAt&&Date.now()>st.nextPoopAt&&!busy()&&!st.sleeping)doPoop();
    if(t>nextTalk&&!busy()){nextTalk=t+rand(22000,38000);talk();}
    if(t>nextFart&&!busy()){nextFart=t+rand(120000,240000);randomFart();}
    tickT+=dt;if(tickT>1){tickT=0;updateBars();checkHomework();}
    saveT+=dt;if(saveT>5){saveT=0;save();}
  }
  // sky
  nightK+=(((st.sleeping||isNight())?1:0)-nightK)*Math.min(1,dt*1.5);
  scene.background.copy(DAY).lerp(NIGHT,nightK);scene.fog.color.copy(scene.background);
  hemi.intensity=.95-.55*nightK;sun.intensity=.75-.55*nightK;
  clouds.children.forEach((c,i)=>{c.position.x+=dt*.25*(i%2?1:-1);if(c.position.x>12)c.position.x=-12;if(c.position.x<-12)c.position.x=12;});
  // frog anim
  const ts=t/1000;const avg=(st.hunger+st.happy+st.energy+st.clean)/4,mn=Math.min(st.hunger,st.happy,st.energy,st.clean);
  const sad=mn<20||avg<40;
  if(!down)targetRotY*=Math.pow(.4,dt);
  frog.rotation.y+=(targetRotY-frog.rotation.y)*Math.min(1,dt*10);
  let y=0,sq=1;
  if(hopT>=0){hopT+=dt/.55;if(hopT>=1){hopT=-1;}else{y=Math.sin(hopT*Math.PI)*.9;sq=1+Math.sin(hopT*Math.PI)*.12;}}
  frog.position.y=y;
  const breathe=st.sleeping?Math.sin(ts*1.5)*.04:Math.sin(ts*2.2)*.02;
  body.scale.set(1/Math.sqrt(sq)*(1-breathe*.5),sq*(1+breathe),1/Math.sqrt(sq)*(1-breathe*.5));
  let rz=0;if(wiggleT>0){wiggleT-=dt;rz=Math.sin(ts*35)*.12;}if(shakeT>0){shakeT-=dt;rz=Math.sin(ts*22)*.15;}
  body.rotation.z=rz;
  // eyes
  let eyeOpen=1;
  if(st.sleeping)eyeOpen=.08;else{nextBlink-=dt;if(nextBlink<0){blinkT=.15;nextBlink=rand(2,5);}if(blinkT>0){blinkT-=dt;eyeOpen=.1;}}
  eyes.forEach(e=>{e.inner.scale.y+=(eyeOpen-e.inner.scale.y)*Math.min(1,dt*25);e.pupil.position.y=sad?-.08:0;e.pupil.position.x=Math.sin(ts*.7)*.04;});
  // mouth
  mouth.rotation.z=sad?0:Math.PI;mouth.position.y=sad?.95:1.12;
  if(chompT>0){chompT-=dt;mouthOpen.scale.y=.02+Math.abs(Math.sin(chompT*16))*.14;}else mouthOpen.scale.y=st.sleeping?.03:.01;
  if(blushT>0)blushT-=dt;cheekM.color.setHex(blushT>0?0xff2d55:0xff9db0);
  // zzz
  if(st.sleeping){zzzT-=dt;if(zzzT<0){zzzT=1.4;const p=frogScreen(2);fx('💤',p.x+30,p.y,[{s:.5,opacity:1},{dx:60,dy:-120,s:1.4,opacity:0}],1800,44);}}
  // poops wobble & flies
  poops.forEach((p,i)=>{const age=(t-p.born)/1000;const grow=Math.min(1,age/.4);const bounce=grow<1?grow*(1+Math.sin(grow*Math.PI)*.4):1;
    p.mesh.scale.set(bounce*(1+Math.sin(ts*4+i)*.05),bounce*(1-Math.sin(ts*4+i)*.05),bounce*(1+Math.sin(ts*4+i)*.05));
    const fl=p.fly,ph=ts*3+fl.userData.ph;fl.position.set(p.x+Math.cos(ph)*.45,.75+Math.sin(ph*2.3)*.12,p.z+Math.sin(ph)*.45);fl.rotation.y=-ph;
    const w=Math.abs(Math.sin(ts*60));fl.userData.w1.scale.y=fl.userData.w2.scale.y=.01+w*.03;});
  // bubble position
  if(bubble.classList.contains('show')){if(t>bubbleUntil)bubble.classList.remove('show');
    const p=frogScreen(st.hat==='sapka'||st.hat==='parti'?3.0:2.45);const bw=bubble.offsetWidth/2+8;
    bubble.style.left=clamp(p.x,bw,innerWidth-bw)+'px';bubble.style.top=Math.max(bubble.offsetHeight+10,p.y)+'px';}
  renderer.render(scene,camera);
}

// ---------------- START ----------------
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);
applyHat();updateSleepBtn();updateBars();
if(st.name){$('#nm').textContent=st.name;setTimeout(()=>{say(st.sleeping?'Zzz... 😴':'Hoş geldin! Seni özledim! 💚');hop();},600);}
else{
  modal('<div class="big">🐸</div><h2>Kurbağan uyandı!<br>Adı ne olsun?</h2><input id="nameIn" maxlength="14" placeholder="Bir isim yaz..." autocomplete="off">',[{t:'Tamam! 💚',fn:()=>{
    const v=(window.__nameVal||'').trim();st.name=v||'Kurbi';$('#nm').textContent=st.name;save();confetti();snd.ding();hop();setTimeout(()=>say('Merhaba! Ben '+st.name+'! 🐸💚',4000),300);}}]);
  const inp=$('#nameIn');inp.addEventListener('input',()=>{window.__nameVal=inp.value;});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){window.__nameVal=inp.value;$('#mCard .btn').click();}});
}
loop();
})();
</script>
