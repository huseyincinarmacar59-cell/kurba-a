<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moda Dünyası">
<meta name="theme-color" content="#ff9ccf">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Moda Dünyası ✨</title>
<style>
:root{--pink:#ff5fa2;--pink2:#ff9ccf;--lilac:#c78bff;--ink:#4a2c4a;--soft:#fff3f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;color:var(--ink);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
 background:#ffe6f2 radial-gradient(#ffc9e2 2.5px,transparent 3px) 0 0/30px 30px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) minmax(360px,46%);gap:14px;
 padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
@media (orientation:portrait){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,54fr) minmax(0,46fr)}}
.stagebox,.panel{min-width:0;min-height:0}

/* ---------- sahne ---------- */
.stagebox{position:relative;background:#fff;border-radius:32px;padding:8px;display:flex;flex-direction:column;min-height:0;
 box-shadow:0 7px 0 #f2a5c8,0 16px 34px rgba(170,60,120,.22);transform:rotate(-.6deg)}
.topbar{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;
 box-shadow:0 0 0 3px #ffd3e8 inset}
.chip.star{background:#fff8d6;box-shadow:0 0 0 3px #ffe58a inset}
.sp{flex:1}
.tbtn{width:52px;height:52px;border-radius:18px;background:#fff;font-size:28px;display:grid;place-items:center;
 box-shadow:0 0 0 3px #ffd3e8,0 5px 0 #f4b6d3;transition:transform .12s}
.tbtn:active{transform:translateY(3px) scale(.94);box-shadow:0 0 0 3px #ffd3e8,0 2px 0 #f4b6d3}
.tbtn.cam{background:linear-gradient(#ff8cc0,#ff5fa2);box-shadow:0 0 0 3px #fff,0 5px 0 #d94584}
.stagewrap{flex:1;min-height:0;position:relative;border-radius:24px;overflow:hidden;-webkit-mask-image:-webkit-radial-gradient(white,black)}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#trash{position:absolute;left:22px;bottom:22px;width:74px;height:74px;border-radius:50%;background:#fff;display:none;place-items:center;font-size:38px;
 box-shadow:0 0 0 4px #ff9ccf,0 6px 14px rgba(0,0,0,.2)}
#trash.show{display:grid}#trash.hot{transform:scale(1.25);background:#ffe0ee}

/* svg animasyonları */
.bounce{animation:bounce .45s ease}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.04,.96)}65%{transform:scale(.98,1.03)}100%{transform:scale(1)}}
#dollInner,#petInner{transform-box:fill-box;transform-origin:50% 100%}
.jump{animation:jump .6s ease}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-40px) rotate(-8deg)}70%{transform:translateY(0) scale(1.08,.92)}}
.stk{cursor:grab}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;min-height:0;gap:10px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 12px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;width:76px;height:80px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 box-shadow:0 0 0 3px #ffd3e8,0 5px 0 #f4b6d3;transform:rotate(var(--r,0deg));transition:transform .15s}
.tab i{font-style:normal;font-size:32px;line-height:1}
.tab span{font-size:13px;font-weight:800}
.tab.on{background:linear-gradient(#ffb2d6,#ff7ab5);color:#fff;box-shadow:0 0 0 4px #fff,0 0 0 7px #ff7ab5,0 7px 0 #d94584;transform:rotate(0) scale(1.06)}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:30px;padding:16px 16px 30px;
 box-shadow:0 7px 0 #f2a5c8,0 16px 34px rgba(170,60,120,.18)}
h3{margin:4px 4px 12px;font-size:20px;display:flex;align-items:center;gap:8px}
h3:not(:first-child){margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.card{position:relative;background:var(--soft);border-radius:22px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;
 box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 7px 0 4px #f6c1db;transform:rotate(var(--r,0deg));transition:transform .15s}
.card:active{transform:rotate(var(--r,0deg)) scale(.93)}
.card svg{width:100%;height:96px}
.card span{font-size:14px;font-weight:800;margin-top:2px}
.card.sel{background:#ffe1f0;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 8px 0 5px #d94584}
.card.sel::after{content:"✓";position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;
 display:grid;place-items:center;font-weight:900;box-shadow:0 0 0 3px #fff}
.card.lock svg{filter:grayscale(1) opacity(.45)}
.card .lk{position:absolute;inset:auto 0 30px;margin:auto;width:max-content;background:#fff;border-radius:999px;padding:3px 10px;font-weight:900;font-size:14px;
 box-shadow:0 0 0 3px #ffe58a}
.none{font-size:44px;height:96px;display:grid;place-items:center;opacity:.6}
.sws{display:flex;flex-wrap:wrap;gap:12px;padding:4px}
.sw{width:54px;height:54px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px #fff,0 0 0 8px #ffd6ea,0 5px 0 6px #f6c1db;
 display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;transition:transform .12s}
.sw:active{transform:scale(.9)}
.sw.sel{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--pink),0 6px 0 8px #d94584;transform:scale(1.08)}
.sw.sel::after{content:"✓";text-shadow:0 1px 2px rgba(0,0,0,.4)}
.sw.x{background:#fff;color:#e05;font-size:26px}.sw.x.sel::after{content:""}
.toggles{display:flex;gap:14px;flex-wrap:wrap}
.tog{flex:1;min-width:130px;padding:14px;border-radius:22px;background:var(--soft);font-size:18px;font-weight:800;
 box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 6px 0 4px #f6c1db}
.tog.sel{background:#ffe1f0;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 7px 0 5px #d94584}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:14px}
.emo button{font-size:46px;height:78px;border-radius:22px;background:var(--soft);box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 6px 0 4px #f6c1db;transform:rotate(var(--r))}
.emo button:active{transform:scale(.88)}
.hint{background:#fff8d6;border-radius:18px;padding:12px 14px;font-weight:700;font-size:16px;margin:4px 0 14px;box-shadow:0 0 0 3px #ffe58a inset}
.big{display:block;width:100%;margin-top:16px;padding:16px;border-radius:22px;font-size:20px;font-weight:900;color:#fff;
 background:linear-gradient(#ff8cc0,#ff5fa2);box-shadow:0 0 0 4px #fff,0 6px 0 4px #d94584}
.big.alt{background:linear-gradient(#d4b0ff,#a96cf5);box-shadow:0 0 0 4px #fff,0 6px 0 4px #8248cf}
.big:active{transform:translateY(3px)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--soft);margin-bottom:10px;font-size:17px;font-weight:700}
.task i{font-style:normal;font-size:30px}.task b{margin-left:auto;font-size:26px}
.task.ok{background:#e6ffef;text-decoration:line-through;text-decoration-color:#4bbf7a;text-decoration-thickness:3px}
.unl{display:flex;flex-wrap:wrap;gap:8px}
.unl span{background:#fff8d6;border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 0 0 3px #ffe58a inset}
.unl span.ok{background:#e6ffef;box-shadow:0 0 0 3px #9be3b6 inset}

/* ---------- modallar ---------- */
.modal{position:fixed;inset:0;background:rgba(255,190,220,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;
 place-items:center;z-index:50;padding:20px}
.modal.show{display:grid}
.box{background:#fff;border-radius:34px;padding:22px;max-width:min(560px,94vw);max-height:92vh;overflow:auto;text-align:center;
 box-shadow:0 0 0 6px #fff,0 0 0 10px #ff9ccf,0 14px 0 10px #e57aad;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}70%{transform:scale(1.05) rotate(1deg)}100%{transform:none;opacity:1}}
.box h2{margin:0 0 10px;font-size:32px}
.box p{font-size:18px;font-weight:700;margin:8px 0}
.box input{width:100%;font:inherit;font-size:26px;font-weight:800;text-align:center;padding:14px;border-radius:20px;border:0;outline:0;
 background:var(--soft);box-shadow:0 0 0 4px #ffd3e8 inset;color:var(--ink);-webkit-user-select:text;user-select:text}
.photo img{width:100%;max-height:60vh;object-fit:contain;border-radius:20px;box-shadow:0 0 0 6px #fff,0 0 0 9px #ffd6ea;
 -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.gal img{width:100%;border-radius:14px;box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea;transform:rotate(var(--r))}
.row{display:flex;gap:12px}.row .big{flex:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:flash .5s ease}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#toast{pointer-events:none;position:fixed;left:50%;top:22px;transform:translate(-50%,-160%);background:#fff;padding:14px 24px;border-radius:999px;font-size:20px;font-weight:900;z-index:70;
 box-shadow:0 0 0 4px #ff9ccf,0 8px 20px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.3,1.6,.6,1);max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.conf{position:fixed;top:-60px;font-size:34px;z-index:65;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.title{font-size:44px;font-weight:900;color:var(--pink);text-shadow:3px 3px 0 #fff,5px 5px 0 #ffc2df;margin:6px 0}
</style>
</head>
<body>
<div id="app">
 <div class="stagebox">
  <div class="topbar">
   <div class="chip" id="nameChip">✨ <span id="nameTxt"></span></div>
   <div class="chip star">⭐ <span id="starTxt">0</span></div>
   <div class="sp"></div>
   <button class="tbtn" id="btnRand" aria-label="Sürpriz kombin">🎲</button>
   <button class="tbtn" id="btnGal" aria-label="Galeri">🖼️</button>
   <button class="tbtn cam" id="btnPhoto" aria-label="Fotoğraf çek">📸</button>
  </div>
  <div class="stagewrap" id="stageWrap"><svg id="stage" viewBox="0 0 400 640" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
   <defs>
    <filter id="stk" x="-20%" y="-12%" width="140%" height="126%">
     <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="d"/>
     <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="ol"/>
     <feOffset in="d" dx="0" dy="6" result="o"/>
     <feFlood flood-color="#7a2a55" flood-opacity=".28"/><feComposite in2="o" operator="in" result="sh"/>
     <feMerge><feMergeNode in="sh"/><feMergeNode in="ol"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stk2" x="-30%" y="-30%" width="160%" height="160%">
     <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/>
     <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="ol"/>
     <feOffset in="d" dx="0" dy="4" result="o"/>
     <feFlood flood-color="#7a2a55" flood-opacity=".3"/><feComposite in2="o" operator="in" result="sh"/>
     <feMerge><feMergeNode in="sh"/><feMergeNode in="ol"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
   </defs>
   <g id="bgWrap"><g id="bg"></g><use href="#bg" transform="translate(0 0) scale(-1 1)"/><use href="#bg" transform="translate(800 0) scale(-1 1)"/><use href="#bg" transform="translate(-800 0)"/><use href="#bg" transform="translate(800 0)"/></g>
   <g transform="translate(50 32)"><g id="dollInner" filter="url(#stk)"></g></g>
   <g transform="translate(330 604) scale(1.05)"><g id="petInner" filter="url(#stk)"></g></g>
   <g id="stkLayer" filter="url(#stk2)"></g>
   <g id="tag" filter="url(#stk2)"></g>
  </svg></div>
  <div id="trash">🗑️</div>
 </div>
 <div class="panel">
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
 </div>
</div>

<div class="modal" id="mStart"><div class="box">
 <div class="title">Moda Dünyası</div>
 <p>👗 Giydir · 💄 Süsle · 📸 Fotoğraf çek</p>
 <p style="margin-top:18px">Bebeğinin adı ne olsun?</p>
 <input id="nameIn" maxlength="14" placeholder="Işıltı" autocomplete="off">
 <button class="big" id="startBtn">Hadi Başlayalım! 💖</button>
</div></div>

<div class="modal" id="mPhoto"><div class="box photo">
 <h2>Harika oldu! 📸</h2>
 <img id="photoImg" alt="Fotoğraf">
 <p>Resme <b>basılı tut</b> → "Fotoğraflara Ekle"</p>
 <div class="row"><button class="big alt" id="shareBtn">📤 Kaydet</button><button class="big" data-close>Tamam</button></div>
</div></div>

<div class="modal" id="mGal"><div class="box">
 <h2>Galerim 🖼️</h2>
 <div id="galList" class="gal"></div>
 <button class="big" data-close>Kapat</button>
</div></div>

<div id="flash"></div><div id="toast"></div>

<script>
"use strict";
/* =====================  yardımcılar  ===================== */
const OL='#4a2c4a';
const $=s=>document.querySelector(s);
const P=(d,f,x='')=>`<path d="${d}" fill="${f}" stroke="${OL}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" ${x}/>`;
const C=(cx,cy,r,f,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${OL}" stroke-width="3" ${x}/>`;
const E=(cx,cy,rx,ry,f,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${OL}" stroke-width="3" ${x}/>`;
const L=(d,c=OL,w=3)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const NS='stroke="none"';
function shade(h,k){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');
 const n=parseInt(h,16);let r=n>>16,g=n>>8&255,b=n&255;
 if(k<=1){r*=k;g*=k;b*=k}else{const t=Math.min(1,k-1);r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t}
 return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function heart(cx,cy,s,f,x=''){cx=+cx;cy=+cy;return `<path d="M${cx} ${cy+s*.9} C${cx-s*1.6} ${cy-s*.2},${cx-s*.6} ${cy-s*1.3},${cx} ${cy-s*.4} C${cx+s*.6} ${cy-s*1.3},${cx+s*1.6} ${cy-s*.2},${cx} ${cy+s*.9}Z" fill="${f}" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round" ${x}/>`}
function star(cx,cy,r,f,st=true){cx=+cx;cy=+cy;r=+r;const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}
 return `<polygon points="${p.join(' ')}" fill="${f}" ${st?`stroke="${OL}" stroke-width="2" stroke-linejoin="round"`:''}/>`}
const q=(a,b,c,t)=>(1-t)*(1-t)*a+2*t*(1-t)*b+t*t*c;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =====================  renkler  ===================== */
const SKIN=['#ffe3d1','#f6c9a8','#e8b08c','#c98b63','#9a6243','#6b432e'];
const HAIRC=['#3b2416','#7a4a2a','#c47a3a','#e8c26a','#f6e7a8','#d9534f','#ff8fc8','#9b7bff','#4fc3f7','#2b2b2b'];
const CLOTHC=['#ff5fa2','#ff9ccf','#c78bff','#7ec8ff','#7be0b4','#ffe066','#ff8a5c','#e8406a','#ffffff','#3b3b58'];
const LIPC=['yok','#e8406a','#ff7aa8','#c2185b','#ff8a5c','#9b4dca'];
const SHADC=['yok','#c78bff','#7ec8ff','#ff9ccf','#7be0b4','#ffd23f'];
const EYEC=['#5b3a29','#2e7dd7','#3a9d5d','#8a5cc7','#2b2b2b'];

/* =====================  vücut  ===================== */
const LEGL="M126 296 L124 538 Q124 548 134 548 L140 548 Q148 548 148 538 L150 296 Z";
const LEGR="M150 296 L152 538 Q152 548 160 548 L166 548 Q176 548 176 538 L174 296 Z";
const TORSO="M118 178 Q150 168 182 178 Q186 206 184 232 Q178 262 178 300 L122 300 Q122 262 116 232 Q114 206 118 178 Z";
const ARML="M120 184 Q104 188 100 230 L96 318 Q96 332 106 332 Q115 332 115 318 L118 244 Q120 222 126 206 Z";
const ARMR="M180 184 Q196 188 200 230 L204 318 Q204 332 194 332 Q185 332 185 318 L182 244 Q180 222 174 206 Z";

/* =====================  saçlar  ===================== */
const CAP="M100 110 Q98 52 150 52 Q202 52 200 110 L198 150 L102 150 Z";
const HAIR={
 uzun:{n:'Uzun',back:c=>P("M100 100 Q100 48 150 50 Q200 48 200 100 L206 250 Q180 262 150 258 Q120 262 94 250 Z",c)+L("M120 200 L118 245 M180 200 L182 245",shade(c,.8)),
  front:c=>P("M102 108 Q100 56 150 54 Q200 56 198 108 Q186 84 160 80 Q150 95 128 92 Q112 92 102 108 Z",c)+L("M130 66 Q150 60 170 66",shade(c,1.35),4)},
 atkuyrugu:{n:'At Kuyruğu',back:c=>P("M176 66 Q240 68 234 150 Q230 212 202 244 Q214 190 200 140 Q192 100 170 86 Z",c)+L("M206 110 Q218 150 210 200",shade(c,.8))+P(CAP,c),
  front:c=>P("M102 112 Q100 56 150 56 Q200 56 198 112 Q190 76 150 72 Q112 74 102 112 Z",c)+C(184,70,8,'#ff5fa2')+L("M128 66 Q150 61 170 66",shade(c,1.35),4)},
 topuz:{n:'Topuz',back:c=>C(150,42,26,c)+L("M134 38 Q150 30 166 40 M138 52 Q150 46 162 52",shade(c,.8))+P(CAP,c),
  front:c=>P("M102 110 Q100 58 150 58 Q200 58 198 110 Q178 72 140 76 Q116 82 102 110 Z",c)+P("M134 66 Q150 60 166 66 L164 72 Q150 68 136 72 Z",'#ff9ccf')},
 kivircik:{n:'Kıvırcık',back:c=>[[100,92,26],[200,92,26],[94,132,24],[206,132,24],[98,172,22],[202,172,22],[118,58,26],[182,58,26],[150,46,28],[108,204,18],[192,204,18]].map(a=>C(a[0],a[1],a[2],c)).join('')+E(150,124,58,74,c,NS),
  front:c=>[[114,78,16],[136,66,16],[160,64,16],[184,76,16]].map(a=>C(a[0],a[1],a[2],c)).join('')},
 kisa:{n:'Kısa Küt',back:c=>P("M96 100 Q96 48 150 48 Q204 48 204 100 L206 164 Q178 172 150 170 Q122 172 94 164 Z",c),
  front:c=>P("M102 108 Q100 54 150 54 Q200 54 198 108 Q176 90 150 92 Q124 90 102 108 Z",c)+L("M128 64 Q150 58 172 64",shade(c,1.35),4)},
 orgu:{n:'Örgülü',back:c=>{let o=P(CAP,c);for(const x of [110,190]){for(let y=158;y<=278;y+=20)o+=E(x,y,13,12,c);o+=C(x,292,6,'#ff5fa2')+P(`M${x-6} 296 L${x} 318 L${x+6} 296 Z`,c)}return o},
  front:c=>P("M102 112 Q100 56 150 56 Q200 56 198 112 Q186 74 152 68 L150 80 L148 68 Q114 74 102 112 Z",c)}
};

/* =====================  kıyafetler  ===================== */
const DRESS={
 yok:{n:'Yok'},

 if(m.blush)o+=`<ellipse cx="119" cy="134" rx="10" ry="6" fill="#ff6fa5" opacity=".45"/><ellipse cx="181" cy="134" rx="10" ry="6" fill="#ff6fa5" opacity=".45"/>`;

function doll(s){const k=s.skin,H=HAIR[s.hair.k],hc=s.hair.c;let o=H.back(hc);
 o+=P(LEGL,k)+P(LEGR,k)+E(136,551,12,7,k)+E(164,551,12,7,k);
 o+=`<rect x="140" y="146" width="20" height="36" rx="6" fill="${k}" stroke="${OL}" stroke-width="3"/>`+P(TORSO,k);
 if(s.shoes!=='yok'){const f=SHOES[s.shoes].f(s.col.shoes);o+=f+`<g transform="translate(28 0)">${f}</g>`}
 let sl='';
 if(s.dress!=='yok'){const d=DRESS[s.dress].f(s.col.dress);o+=d.m;sl=d.s}
 else{o+=BOTTOMS[s.bottom].f(s.col.bottom);const t=TOPS[s.top].f(s.col.top);o+=t.m;sl=t.s}
 o+=P(ARML,k)+P(ARMR,k)+sl;
 o+=C(104,114,8,k)+C(196,114,8,k)+E(150,108,46,50,k)+face(s)+H.front(hc);
 for(const a of s.acc)if(ACC[a])o+=ACC[a].f();
 return o}

const TASKS=[
 {id:'pembe',i:'👗',t:'Pembe bir elbise giydir',ok:s=>s.dress!=='yok'&&['#ff5fa2','#ff9ccf'].includes(s.col.dress)},
 {id:'tac',i:'👑',t:'Başına taç tak',ok:s=>s.acc.includes('tac')},
 {id:'dost',i:'🐾',t:'Kendine bir dost seç',ok:s=>s.pet!=='yok'},
 {id:'mor',i:'💜',t:'Saçını mor yap',ok:s=>s.hair.c==='#9b7bff'},
 {id:'makyaj',i:'💄',t:'Ruj sür ve allık yap',ok:s=>s.mk.lip!=='yok'&&s.mk.blush},
 {id:'sticker',i:'✨',t:'3 sticker yapıştır',ok:s=>s.stickers.length>=3},
 {id:'plaj',i:'🏖️',t:'Plajda fotoğraf çek',ok:(s,e)=>e==='photo'&&s.bg==='plaj'},
 {id:'spor',i:'👟',t:'Şort ve spor ayakkabı giydir',ok:s=>s.dress==='yok'&&s.bottom==='sort'&&s.shoes==='spor'},
 {id:'kivir',i:'🌀',t:'Kıvırcık saç dene',ok:s=>s.hair.k==='kivircik'},
 {id:'sahne',i:'🎤',t:'Sahnede fotoğraf çek',ok:(s,e)=>e==='photo'&&s.bg==='sahne'}
];
const UNLOCKS=[[2,'🌈 Gökkuşağı Elbise'],[4,'🦄 Unicorn Dost'],[6,'🪐 Uzay'],[8,'🪄 Sihirli Asa'],[10,'🏰 Şato']];

/* =====================  durum  ===================== */
const KEY='moda-dunyasi-v1';
const DEF={name:'',skin:'#f6c9a8',hair:{k:'uzun',c:'#e8c26a'},dress:'prenses',top:'tisort',bottom:'etek',shoes:'babet',
 col:{dress:'#c78bff',top:'#7ec8ff',bottom:'#ff9ccf',shoes:'#ff5fa2'},acc:['fiyonk'],mk:{lip:'yok',shadow:'yok',eye:'#5b3a29',blush:false,sim:false},
 pet:'yok',bg:'oda',stickers:[],done:[],gal:[]};
let S;
try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=structuredClone(DEF)}
if(!Array.isArray(S.gal))S.gal=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){try{S.gal=S.gal.slice(-4);localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}}
const stars=()=>S.done.length;
const locked=it=>it&&it.lock&&stars()<it.lock;

/* =====================  ses  ===================== */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d=.1,t='sine',v=.14,dl=0){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,n);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
const SND={tap:()=>{tone(700,.07,'triangle');tone(1050,.08,'triangle',.1,.05)},pop:()=>{tone(500,.06,'sine',.2);tone(900,.1,'sine',.12,.04)},
 star:()=>[660,830,990,1320].forEach((f,i)=>tone(f,.18,'triangle',.13,i*.09)),no:()=>{tone(300,.12,'square',.06);tone(240,.16,'square',.06,.1)},
 snap:()=>{tone(1800,.04,'square',.08);tone(900,.08,'square',.06,.04)},pet:()=>{tone(880,.08,'sine',.15);tone(1200,.1,'sine',.12,.08)}};
document.addEventListener('pointerdown',audio,{capture:true});

/* =====================  çizim  ===================== */
const stageEl=$('#stage');
function renderStage(anim){
 $('#bg').innerHTML=BGS[S.bg].d();
 $('#dollInner').innerHTML=doll(S);
 $('#petInner').innerHTML=S.pet!=='yok'?PETS[S.pet].f():'';
 renderStickers();
 const nm=S.name||'Işıltı',w=nm.length*13+56;
 $('#tag').innerHTML=`<g transform="translate(18 16) rotate(-4)"><rect width="${w}" height="44" rx="22" fill="#fff" stroke="#ff9ccf" stroke-width="4"/><text x="${w/2}" y="29" text-anchor="middle" font-family="ui-rounded,Arial Rounded MT Bold,Arial,sans-serif" font-weight="900" font-size="21" fill="#ff5fa2">✨ ${esc(nm)}</text></g>`;
 $('#nameTxt').textContent=nm;$('#starTxt').textContent=stars();
 if(anim){const d=$('#dollInner');d.classList.remove('bounce');void d.getBBox();d.classList.add('bounce')}
}
function renderStickers(){$('#stkLayer').innerHTML=S.stickers.map((s,i)=>`<text class="stk" data-i="${i}" x="${s.x}" y="${s.y}" font-size="${s.s}" text-anchor="middle" dominant-baseline="central" transform="rotate(${s.r} ${s.x} ${s.y})">${s.e}</text>`).join('')}

/* =====================  panel  ===================== */
const TABS=[['sac','💇‍♀️','Saç'],['elbise','👗','Elbise'],['ust','👚','Üst'],['alt','🩳','Alt'],['ayakkabi','👠','Ayakkabı'],['taki','👑','Takı'],['makyaj','💄','Makyaj'],
 ['ten','🎨','Ten'],['dost','🐶','Dost'],['yer','🏰','Yer'],['sticker','✨','Sticker'],['gorev','⭐','Görev']];
let tab='elbise';
$('#tabs').innerHTML=TABS.map((t,i)=>`<button class="tab" data-act="tab" data-v="${t[0]}" style="--r:${(i%3-1)*2}deg"><i>${t[1]}</i><span>${t[2]}</span></button>`).join('');
const rot=i=>`--r:${[-2,1.5,-1,2,-1.5,1][i%6]}deg`;
const mini=(vb,s)=>`<svg viewBox="${vb}">${doll(s)}</svg>`;
const withS=f=>{const c=structuredClone(S);f(c);return c};
function cards(obj,act,cur,vb,mk){return '<div class="grid">'+Object.entries(obj).map(([k,it],i)=>{
 const lk=locked(it),sel=Array.isArray(cur)?cur.includes(k):cur===k;
 const body=k==='yok'?`<div class="none">🚫</div>`:mk(k);
 return `<button class="card ${sel?'sel':''} ${lk?'lock':''}" style="${rot(i)}" data-act="${act}" data-v="${k}">${body}<span>${it.n}</span>${lk?`<b class="lk">🔒 ⭐${it.lock}</b>`:''}</button>`}).join('')+'</div>'}
function swatches(list,act,cur){return '<div class="sws">'+list.map(c=>c==='yok'?`<button class="sw x ${cur==='yok'?'sel':''}" data-act="${act}" data-v="yok">✕</button>`
 :`<button class="sw ${cur===c?'sel':''}" style="--c:${c}" data-act="${act}" data-v="${c}"></button>`).join('')+'</div>'}

function renderPanel(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
 const el=$('#content'),st=el.scrollTop;let h='';
 switch(tab){
  case 'sac':h=`<h3>💇‍♀️ Saç Modeli</h3>`+cards(HAIR,'hair',S.hair.k,'',k=>mini('60 12 180 250',withS(c=>{c.hair.k=k;c.acc=[]})))+`<h3>🎨 Saç Rengi</h3>`+swatches(HAIRC,'hc',S.hair.c);break;
  case 'elbise':h=`<h3>👗 Elbiseler</h3>`+cards(DRESS,'dress',S.dress,'',k=>mini('40 160 220 410',withS(c=>{c.dress=k;c.acc=[]})))+`<h3>🎨 Elbise Rengi</h3>`+swatches(CLOTHC,'dc',S.col.dress);break;
  case 'ust':h=`<h3>👚 Üstler</h3>`+cards(TOPS,'top',S.dress==='yok'?S.top:'','',k=>mini('80 160 140 180',withS(c=>{c.dress='yok';c.top=k;c.acc=[]})))+`<h3>🎨 Üst Rengi</h3>`+swatches(CLOTHC,'tc',S.col.top);break;
  case 'alt':h=`<h3>🩳 Altlar</h3>`+cards(BOTTOMS,'bottom',S.dress==='yok'?S.bottom:'','',k=>mini('68 270 164 280',withS(c=>{c.dress='yok';c.bottom=k;c.acc=[]})))+`<h3>🎨 Alt Rengi</h3>`+swatches(CLOTHC,'bc',S.col.bottom);break;
  case 'ayakkabi':h=`<h3>👠 Ayakkabılar</h3>`+cards(SHOES,'shoes',S.shoes,'',k=>mini('104 452 94 120',withS(c=>{c.shoes=k;c.dress='yok';c.bottom='sort'})))+`<h3>🎨 Ayakkabı Rengi</h3>`+swatches(CLOTHC,'sc',S.col.shoes);break;
  case 'taki':h=`<h3>👑 Takılar <small style="font-size:14px;opacity:.7">(istediğin kadar seç!)</small></h3>`+cards(ACC,'acc',S.acc,'',k=>mini(['canta','asa'].includes(k)?'40 200 200 180':k==='kolye'?'95 120 110 100':'75 25 150 150',withS(c=>{c.acc=[k]})));break;
  case 'makyaj':h=`<h3>💋 Ruj</h3>`+swatches(LIPC,'lip',S.mk.lip)+`<h3>👁️ Far</h3>`+swatches(SHADC,'shadow',S.mk.shadow)+`<h3>🔵 Göz Rengi</h3>`+swatches(EYEC,'eye',S.mk.eye)
   +`<h3>✨ Ekstralar</h3><div class="toggles"><button class="tog ${S.mk.blush?'sel':''}" data-act="blush">😊 Allık</button><button class="tog ${S.mk.sim?'sel':''}" data-act="sim">✨ Simli Yanak</button></div>`;break;
  case 'ten':h=`<h3>🎨 Ten Rengi</h3>`+swatches(SKIN,'skin',S.skin);break;
  case 'dost':h=`<h3>🐶 Dostunu Seç</h3><div class="hint">Dostuna dokun, zıplasın! 💕</div>`+cards(PETS,'pet',S.pet,'',k=>`<svg viewBox="-70 -125 140 135">${PETS[k].f()}</svg>`);break;
  case 'yer':h=`<h3>🏰 Nerede Olalım?</h3>`+cards(BGS,'bg',S.bg,'',k=>`<svg viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice">${BGS[k].d()}</svg>`);break;
  case 'sticker':h=`<h3>✨ Sticker Yapıştır</h3><div class="hint">Dokun → sahneye yapışır. Parmağınla sürükle, 🗑️ çöpe atarak sil!</div><div class="emo">`
   +STICKERS.map((e,i)=>`<button style="${rot(i)}" data-act="stk" data-v="${e}">${e}</button>`).join('')+`</div><button class="big alt" data-act="clearstk">🧽 Hepsini Temizle</button>`;break;
  case 'gorev':h=`<h3>⭐ Görevler (${stars()}/${TASKS.length})</h3>`+TASKS.map(t=>{const ok=S.done.includes(t.id);return `<div class="task ${ok?'ok':''}"><i>${t.i}</i>${t.t}<b>${ok?'⭐':'☆'}</b></div>`}).join('')
   +`<h3>🎁 Açılan Sürprizler</h3><div class="unl">`+UNLOCKS.map(u=>`<span class="${stars()>=u[0]?'ok':''}">${stars()>=u[0]?'✅':'🔒 ⭐'+u[0]} ${u[1]}</span>`).join('')+`</div>`
   +`<button class="big" data-act="gal">🖼️ Galerim</button><button class="big alt" data-act="rename">✏️ İsmi Değiştir</button>`;break;
 }
 el.innerHTML=h;el.scrollTop=st;
}

/* =====================  aksiyonlar  ===================== */
function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
function confetti(n=34){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='conf';s.textContent=rnd(['⭐','💖','✨','🌸','🎀','💎']);
 s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.8+Math.random()*1.6)+'s';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function checkTasks(ev){const before=stars();let got=[];
 for(const t of TASKS)if(!S.done.includes(t.id)&&t.ok(S,ev)){S.done.push(t.id);got.push(t)}
 if(!got.length)return;save();
 setTimeout(()=>{SND.star();confetti();toast(`Görev tamam: ${got[0].t}! ⭐`,2600);
  const u=UNLOCKS.find(u=>before<u[0]&&stars()>=u[0]);if(u)setTimeout(()=>{toast(`🎁 Yeni sürpriz açıldı: ${u[1]}!`,3200);confetti(50)},2700);
  $('#starTxt').textContent=stars();renderPanel()},350)}
const LOOK={dress:DRESS,top:TOPS,bottom:BOTTOMS,shoes:SHOES,acc:ACC,pet:PETS,bg:BGS,hair:HAIR};
function act(a,v,btn){
 if(LOOK[a]&&locked(LOOK[a][v])){SND.no();btn&&(btn.classList.remove('shake'),void btn.offsetWidth,btn.classList.add('shake'));toast(`🔒 Bunu açmak için ⭐${LOOK[a][v].lock} yıldız lazım! Görevlere bak 😉`,2800);return}
 let anim=true;
 switch(a){
  case 'tab':tab=v;SND.tap();renderPanel();if(v==='gorev')$('#content').scrollTop=0;return;
  case 'hair':S.hair.k=v;break; case 'hc':S.hair.c=v;break;
  case 'dress':S.dress=v;break; case 'dc':S.col.dress=v;if(S.dress==='yok')S.dress='prenses';break;
  case 'top':S.top=v;S.dress='yok';break; case 'tc':S.col.top=v;S.dress='yok';break;
  case 'bottom':S.bottom=v;S.dress='yok';break; case 'bc':S.col.bottom=v;S.dress='yok';break;
  case 'shoes':S.shoes=v;break; case 'sc':S.col.shoes=v;if(S.shoes==='yok')S.shoes='babet';break;
  case 'acc':S.acc=S.acc.includes(v)?S.acc.filter(x=>x!==v):[...S.acc,v];break;
  case 'lip':case 'shadow':case 'eye':S.mk[a]=v;break;
  case 'blush':case 'sim':S.mk[a]=!S.mk[a];break;
  case 'skin':S.skin=v;break;
  case 'pet':S.pet=v;anim=false;setTimeout(petJump,60);break;
  case 'bg':S.bg=v;anim=false;break;
  case 'stk':S.stickers.push({e:v,x:Math.round(60+Math.random()*280),y:Math.round(90+Math.random()*420),s:Math.round(44+Math.random()*16),r:Math.round(Math.random()*30-15)});
   if(S.stickers.length>30)S.stickers.shift();anim=false;break;
  case 'clearstk':S.stickers=[];anim=false;break;
  case 'gal':openGal();return;
  case 'rename':openStart();return;
 }
 SND.pop();save();renderStage(anim);renderPanel();checkTasks();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset.v,b);
 if(e.target.closest('[data-close]'))e.target.closest('.modal').classList.remove('show')});

function petJump(){const p=$('#petInner');if(!p.firstChild)return;p.classList.remove('jump');void p.getBBox();p.classList.add('jump');SND.pet()}
$('#petInner').addEventListener('pointerdown',petJump);
$('#dollInner').addEventListener('pointerdown',()=>{renderStage(true);tone(990,.08,'sine',.12);tone(1320,.1,'sine',.1,.07)});

/* sürpriz kombin */
$('#btnRand').onclick=()=>{const free=o=>Object.keys(o).filter(k=>!locked(o[k]));
 S.hair={k:rnd(free(HAIR)),c:rnd(HAIRC)};
 if(Math.random()<.5){S.dress=rnd(free(DRESS).filter(k=>k!=='yok'));S.col.dress=rnd(CLOTHC)}else{S.dress='yok';S.top=rnd(free(TOPS));S.bottom=rnd(free(BOTTOMS));S.col.top=rnd(CLOTHC);S.col.bottom=rnd(CLOTHC)}
 S.shoes=rnd(free(SHOES).filter(k=>k!=='yok'));S.col.shoes=rnd(CLOTHC);
 S.acc=free(ACC).filter(()=>Math.random()<.35);S.mk={lip:rnd(LIPC),shadow:rnd(SHADC),eye:S.mk.eye,blush:Math.random()<.6,sim:Math.random()<.4};
 [600,800,1000,1200].forEach((f,i)=>tone(f,.08,'triangle',.12,i*.05));save();renderStage(true);renderPanel();checkTasks()};

/* =====================  sticker sürükleme  ===================== */
const trash=$('#trash');let drag=null;
function svgPt(e){const p=stageEl.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(stageEl.getScreenCTM().inverse())}
function overTrash(e){const r=trash.getBoundingClientRect();return e.clientX>r.left-10&&e.clientX<r.right+10&&e.clientY>r.top-10&&e.clientY<r.bottom+10}
$('#stkLayer').addEventListener('pointerdown',e=>{const t=e.target.closest('[data-i]');if(!t)return;e.preventDefault();
 const i=+t.dataset.i,p=svgPt(e),s=S.stickers[i];drag={i,t,dx:s.x-p.x,dy:s.y-p.y};
 // en üste taşı
 S.stickers.push(S.stickers.splice(i,1)[0]);drag.i=S.stickers.length-1;t.parentNode.appendChild(t);
 trash.classList.add('show');stageEl.setPointerCapture(e.pointerId);SND.tap()});
stageEl.addEventListener('pointermove',e=>{if(!drag)return;const p=svgPt(e),s=S.stickers[drag.i];
 s.x=Math.round(p.x+drag.dx);s.y=Math.round(p.y+drag.dy);
 drag.t.setAttribute('x',s.x);drag.t.setAttribute('y',s.y);drag.t.setAttribute('transform',`rotate(${s.r} ${s.x} ${s.y})`);
 trash.classList.toggle('hot',overTrash(e))});
function endDrag(e){if(!drag)return;if(overTrash(e)){S.stickers.splice(drag.i,1);tone(260,.15,'sawtooth',.06);toast('Sticker silindi 🗑️',1200)}
 drag=null;trash.classList.remove('show','hot');save();renderStickers();checkTasks()}
stageEl.addEventListener('pointerup',endDrag);stageEl.addEventListener('pointercancel',endDrag);

/* =====================  fotoğraf  ===================== */
function snapshot(){return new Promise((res,rej)=>{
 const cl=stageEl.cloneNode(true);cl.setAttribute('width','800');cl.setAttribute('height','1280');cl.removeAttribute('style');
 cl.setAttribute('viewBox','0 0 400 640');const bw=cl.querySelector('#bgWrap');bw.removeAttribute('transform');bw.querySelectorAll('use').forEach(u=>u.remove());
 cl.querySelectorAll('.bounce,.jump').forEach(n=>n.removeAttribute('class'));
 const xml=new XMLSerializer().serializeToString(cl);
 const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=800;c.height=1280;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,800,1280);
  x.drawImage(img,0,0,800,1280);
  // alt köşeye küçük damga
  x.font='900 30px ui-rounded, Arial Rounded MT Bold, Arial';x.fillStyle='rgba(255,255,255,.9)';x.textAlign='right';x.fillText('Moda Dünyası ✨',780,1260);
  res(c)};img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)})}
let curPng=null;
$('#btnPhoto').onclick=async()=>{const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');SND.snap();
 try{const c=await snapshot();curPng=c.toDataURL('image/png');$('#photoImg').src=curPng;
  const t=document.createElement('canvas');t.width=500;t.height=800;t.getContext('2d').drawImage(c,0,0,500,800);
  S.gal.push(t.toDataURL('image/jpeg',.8));if(S.gal.length>12)S.gal.shift();save();
  $('#mPhoto').classList.add('show');checkTasks('photo')}catch(e){toast('Fotoğraf çekilemedi 😢')}};
async function sharePic(url){try{const b=await (await fetch(url)).blob();const file=new File([b],'moda-dunyasi.'+(b.type.includes('png')?'png':'jpg'),{type:b.type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Moda Dünyası'});return}
 const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove()}catch(e){if(e&&e.name!=='AbortError')toast('Resme basılı tutarak kaydedebilirsin 📲',2800)}}
$('#shareBtn').onclick=()=>curPng&&sharePic(curPng);
function openGal(){const g=$('#galList');g.innerHTML=S.gal.length?S.gal.slice().reverse().map((u,i)=>`<img src="${u}" data-g="${S.gal.length-1-i}" style="${rot(i)}">`).join(''):'<p style="grid-column:1/-1">Henüz fotoğraf yok. 📸 butonuna bas!</p>';$('#mGal').classList.add('show');SND.tap()}
$('#btnGal').onclick=openGal;
$('#galList').addEventListener('click',e=>{const im=e.target.closest('img');if(!im)return;curPng=S.gal[+im.dataset.g];$('#photoImg').src=curPng;$('#mGal').classList.remove('show');$('#mPhoto').classList.add('show')});

/* =====================  başlangıç  ===================== */
function openStart(){$('#nameIn').value=S.name||'';$('#mStart').classList.add('show')}
$('#startBtn').onclick=()=>{S.name=($('#nameIn').value.trim()||'Işıltı').slice(0,14);save();$('#mStart').classList.remove('show');$('#nameIn').blur();renderStage(true);SND.star();confetti(24)};
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#startBtn').click()});
$('#nameChip').onclick=openStart;
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* sahneyi kutuya sığdır: bebek hep tam görünür, arka plan taşar */
let fitRaf=0,lastWH='';
function fit(){cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(doFit)}
function doFit(){const r=$('#stageWrap').getBoundingClientRect();const wh=Math.round(r.width)+'x'+Math.round(r.height);if(wh===lastWH)return;lastWH=wh;if(!r.width||!r.height)return;const ar=r.width/r.height;let x=0,y=0,w=400,h=640;
 if(ar>400/640){w=640*ar;x=(400-w)/2}else{h=400/ar;y=(640-h)/2}
 stageEl.setAttribute('viewBox',`${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
 const k=Math.max(1,h/640)*1.002;$('#bgWrap').setAttribute('transform',`translate(200 320) scale(${k.toFixed(4)}) translate(-200 -320)`)}
addEventListener('resize',fit);addEventListener('orientationchange',()=>{lastWH='';setTimeout(fit,350);setTimeout(fit,800)});
if(window.ResizeObserver)new ResizeObserver(fit).observe($('#stageWrap'));
renderStage();renderPanel();doFit();
if(!S.name)openStart();
</script>
